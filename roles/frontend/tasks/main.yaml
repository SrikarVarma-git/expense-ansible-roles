- name: install nginx
  ansible.builtin.package:
    name: nginx
    state: present 
  
- name: enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: import reusable code to another role
  ansible.builtin.import_role:
   name: common
   tasks_from: app-pre-req

- name: Copy backend service
  ansible.builtin.template:
    src: expense.conf.j2
    dest: /etc/nginx/default.d/expesne.conf
  notify:
  - Restart nginx

